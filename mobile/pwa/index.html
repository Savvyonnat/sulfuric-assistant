<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sulfuric Assistant</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="title">
        <span class="dot"></span>
        <div>
          <h1>Sulfuric</h1>
          <p id="status">AI assistant</p>
        </div>
      </div>
      <button id="phoneBtn" class="icon-btn" aria-label="Phone status">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="typing" class="typing hidden"><span></span><span></span><span></span></div>

    <form id="composer" class="composer">
      <button type="button" id="micBtn" class="round-btn" aria-label="Suara">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <input id="input" type="text" autocomplete="off" placeholder="Type a message..." aria-label="Pesan">
      <button type="submit" class="round-btn send" aria-label="Kirim">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </div>

  <div id="settings" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet-head">
      <h2 id="settingsTitle">API settings</h2>
      <button id="closeSettings" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body">
      <label>API Key
        <input id="apiKey" type="password" placeholder="gsk_... (leave empty for the free provider)" autocomplete="off">
      </label>
      <label>Base URL
        <input id="baseUrl" type="text" placeholder="https://api.groq.com/openai/v1" autocomplete="off">
      </label>
      <label>Model
        <input id="model" type="text" placeholder="openai/gpt-oss-120b" autocomplete="off">
      </label>
      <label>Temperature
        <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.8">
      </label>
      <p class="hint">Default without a key: <code>https://text.pollinations.ai/openai</code> (free, slow).
        Add a key to use Groq/Gemini/etc. The key is only stored on this device.</p>
      <div class="sheet-actions">
        <button id="clearChat" class="btn ghost">Clear chat</button>
        <button id="saveSettings" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <div id="phone" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="phoneTitle">
    <div class="sheet-head">
      <h2 id="phoneTitle">My phone</h2>
      <button id="closePhone" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body">
      <div id="phoneBody" class="phone-body"><p class="hint">Loading...</p></div>
      <div class="sheet-actions">
        <button id="refreshPhone" class="btn primary">Refresh</button>
      </div>
      <p class="hint">Reads battery, storage, memory, network and device info. Nothing leaves this phone.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
